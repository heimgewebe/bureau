name: pr1814-review-fix2

on:
  push:
    branches:
      - fix/bureau-control-plane-v3-t006-lifecycle-reconciliation-20260808
    paths:
      - .github/workflows/pr1814-review-fix2.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify bootstrap parent
        env:
          EXPECTED_PARENT: b56206be51088d1473abe02d9991816236d4b14f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
      - name: Correct transaction anchors
        run: python .github/pr1814_fix_anchor.py
      - name: Apply deterministic review patch
        run: python .github/pr1814_review_fix2.py
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate review fixes
        run: |
          set -euo pipefail
          python -m pytest tests/test_v2.py -k 'lifecycle_reconcile or lifecycle_completion or close_ready' -q
          python -m ruff check src/bureau/v2.py tests/test_v2.py
          git diff --check
      - name: Commit and push if branch is unchanged
        env:
          BRANCH: fix/bureau-control-plane-v3-t006-lifecycle-reconciliation-20260808
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/pr1814-review-fix2.yml .github/pr1814_review_fix2.py .github/pr1814_fix_anchor.py
          git add src/bureau/v2.py tests/test_v2.py
          git diff --cached --quiet && { echo 'no patch produced'; exit 1; }
          git commit -m 'fix(bureau): require lifecycle verification evidence'
          git fetch origin "${BRANCH}"
          expected_remote="$(git rev-parse HEAD^)"
          actual_remote="$(git rev-parse FETCH_HEAD)"
          test "${actual_remote}" = "${expected_remote}"
          git push origin "HEAD:refs/heads/${BRANCH}"
