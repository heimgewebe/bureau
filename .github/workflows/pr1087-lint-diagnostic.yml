name: pr1087-diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact pull-request head quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "https://github.com/${REPOSITORY}.git"
          git -C source fetch --quiet --depth=1 origin "${HEAD_SHA}"
          git -C source checkout --quiet --detach FETCH_HEAD
      - name: Install project development tools quietly
        run: python -m pip install --quiet -e 'source[dev]'
      - name: Report Ruff findings
        working-directory: source
        run: python -m ruff check src tests
  full-pytest-first-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact pull-request head quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "https://github.com/${REPOSITORY}.git"
          git -C source fetch --quiet --depth=1 origin "${HEAD_SHA}"
          git -C source checkout --quiet --detach FETCH_HEAD
      - name: Install project development tools quietly
        run: python -m pip install --quiet -e 'source[dev]'
      - name: Isolate first full-suite failure
        working-directory: source
        run: python -m pytest -q --tb=line -x
