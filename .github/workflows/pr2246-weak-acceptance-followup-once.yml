name: PR 2246 weak acceptance follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "259720a7251950019da834d63b6ed531e18cb544"
          git diff --quiet f11b507dad86c4ac7c96c913727990e89763a4cb HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply exact follow-up
        run: python3 .github/pr2246-weak-acceptance-followup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate focused identity cases
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_operator_intake.py -k 'predicate_inversion_as_weak_subject_support or acceptance_predicate_inversion_anchor or retained_broad_identifier_suffix_swap or subject_prefix_before_relocated_identifier or identifier_moved_behind_action or removed_strong_leading_identifier or title_cased_identifier_as_plural or lowercase_as_os_regular_plural or regular_trailing_s_plural or exact_one_token_title or single_complete_subject_token'
          python -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/operator_intake.py tests/test_operator_intake.py
          git rm .github/pr2246-weak-acceptance-followup.py .github/workflows/pr2246-weak-acceptance-followup-once.yml
          git commit -m "fix(intake): require exact acceptance for weak text anchors"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
