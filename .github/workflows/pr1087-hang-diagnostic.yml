name: pr1087-hang-diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  filewise-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone exact pull-request head quietly
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init --quiet source
          git -C source remote add origin "https://github.com/${REPOSITORY}.git"
          git -C source fetch --quiet --depth=1 origin "${HEAD_SHA}"
          git -C source checkout --quiet --detach FETCH_HEAD
      - name: Install project development tools quietly
        run: python -m pip install --quiet -e 'source[dev]'
      - name: Run each test file with a hard timeout
        working-directory: source
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -u -o pipefail
          while IFS= read -r -d '' test_file; do
            echo "BEGIN_TEST_FILE=${test_file}"
            timeout --signal=TERM --kill-after=15s 240s python -m pytest -q "${test_file}"
            status=$?
            echo "END_TEST_FILE=${test_file};STATUS=${status}"
            if [[ ${status} -ne 0 ]]; then
              exit "${status}"
            fi
          done < <(find tests -maxdepth 1 -type f -name 'test_*.py' -print0 | sort -z)
