name: PR 2246 lint-only follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "409995fc62aa79d6fd967fc539a1087ca83e9b2a"
          git diff --quiet 8097bf90c9333fd3b64ea598f64e0737c662dab1 HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply lint-only follow-up
        run: python3 .github/pr2246-format-followup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate formatting only
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          python -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_operator_intake.py
          git rm .github/pr2246-format-followup.py .github/workflows/pr2246-format-followup-once.yml
          git commit -m "test(intake): wrap identity regression name"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
