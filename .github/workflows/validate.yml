name: validate
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: write

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apply-pr1322:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1322
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact patch if still needed
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'from .approval import explicit_operator_approval, require_approval, task_approval_contract' src/bureau/v2.py; then
            python tools/_pr1322_apply.py
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install test environment
        if: steps.patch.outputs.changed == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Validate coordinated approval contract
        if: steps.patch.outputs.changed == 'true'
        run: python -m pytest -q tests/test_v2.py -k 'coordinated_claim or coordinated_runtime'
      - name: Check patch hygiene
        if: steps.patch.outputs.changed == 'true'
        run: git diff --check
      - name: Commit verified patch
        if: steps.patch.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/v2.py src/bureau/cli.py tests/test_v2.py
          git commit -m "Enforce declared approval class in coordinated claims"
          git push origin "HEAD:${BRANCH}"

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          registry_only=false
          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == merge_group ]]; then
            base_sha="${MERGE_GROUP_BASE_SHA}"
            head_sha="${MERGE_GROUP_HEAD_SHA}"
          fi
          if [[ -n "${base_sha}" && -n "${head_sha}" ]]; then
            mapfile -t changed_entries < <(git diff --name-status --diff-filter=ACMRTD "${base_sha}...${head_sha}")
            if [[ ${#changed_entries[@]} -gt 0 ]]; then
              registry_only=true
              for changed_entry in "${changed_entries[@]}"; do
                change_status="${changed_entry%%$'\t'*}"
                changed_path="${changed_entry#*$'\t'}"
                if [[ "${change_status}" != A && "${change_status}" != M ]]; then
                  registry_only=false
                  break
                fi
                if [[ ! "${changed_path}" =~ ^registry/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,239}\.json$ ]]; then
                  registry_only=false
                  break
                fi
              done
            fi
          fi
          echo "registry_only=${registry_only}" >> "${GITHUB_OUTPUT}"
      - run: python -m pip install -e '.[dev]'
      - name: Validate code and repository contracts
        if: steps.scope.outputs.registry_only != 'true'
        run: make validate
      - name: Validate Registry-only change
        if: steps.scope.outputs.registry_only == 'true'
        run: PYTHONPATH=src python -m bureau.cli --root . --json check
