name: PR 2175 post-merge CI repair

on:
  push:
    branches:
      - pr2175-postmerge-ci-repair-stage-20260827

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: launch PR 2175 post-merge CI repair' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply exact post-merge repair
        run: python .github/scripts/tmp_pr2175_postmerge_ci_repair.py
      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_runtime_refresh.py::test_registry_source_precondition_authorities_use_source_precondition_mode \
            tests/test_runtime_refresh.py::test_registry_source_precondition_authorities_have_complete_no_run_acceptance_contracts
          python -m ruff check tests/test_runtime_refresh.py
          python -m json.tool \
            registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-UNUSED-SUCCESSOR-20260827.json \
            >/dev/null
          PYTHONPATH=src python -m bureau.cli --root . --json check >/dev/null
          git diff --check
      - name: Commit self-clean validated output
        shell: bash
        env:
          OUTPUT_BRANCH: pr2175-postmerge-ci-repair-output-20260827
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git rm \
            .github/workflows/pr2175-postmerge-ci-repair.yml \
            .github/scripts/tmp_pr2175_postmerge_ci_repair.py
          git add -- \
            registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-UNUSED-SUCCESSOR-20260827.json \
            tests/test_runtime_refresh.py
          git diff --cached --check
          expected=$(cat <<'EOF'
          .github/scripts/tmp_pr2175_postmerge_ci_repair.py
          .github/workflows/pr2175-postmerge-ci-repair.yml
          registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-UNUSED-SUCCESSOR-20260827.json
          tests/test_runtime_refresh.py
          EOF
          )
          observed=$(git diff --cached --name-only | sort)
          test "$observed" = "$(printf '%s\n' "$expected" | sort)"
          git config user.name 'grabowski-operator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Repair PR 2175 post-merge authority registry validation'
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
