name: Temporary PR 2175 acceptance replay fix

on:
  push:
    branches:
      - fix/runtime-refresh-authority-preflight-r3-20260825

permissions:
  contents: write

jobs:
  apply-fix:
    if: "${{ github.event.head_commit.message == 'ci: run guarded PR 2175 replay fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply exact guarded patch
        run: python .github/scripts/tmp_pr2175_acceptance_replay_fix.py
      - name: Focused validation
        shell: bash
        run: |
          python -m pytest -q tests/test_runtime_refresh.py -k 'no_run_closeout_rejects_rewritten_acceptance_evidence_hash_on_replay or no_run_closeout_is_receipt_bound_and_idempotent or no_run_closeout_rejects_missing_required_evidence_class_on_replay or no_run_closeout_rejects_frozen_acceptance_contract_drift_on_replay or no_run_closeout_rejects_unbound_acceptance_task_spec_on_replay'
          python -m ruff check src/bureau/runtime_refresh.py tests/test_runtime_refresh.py
          git diff --check
      - name: Commit guarded fix
        shell: bash
        run: |
          git config user.name 'grabowski-operator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- src/bureau/runtime_refresh.py tests/test_runtime_refresh.py .github/workflows/tmp-pr2175-acceptance-replay-fix.yml .github/scripts/tmp_pr2175_acceptance_replay_fix.py
          git commit -m 'Harden acceptance evidence replay binding'
          git push origin HEAD:${GITHUB_REF_NAME}
