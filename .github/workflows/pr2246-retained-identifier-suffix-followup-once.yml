name: PR 2246 retained identifier suffix follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "9b6e96a031186469e91305cc1d54132e4ae6dc7b"
          git diff --quiet f86a04ee34e16b0ddaceb87530b53456237cdc94 HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply exact follow-up
        run: python3 .github/pr2246-retained-identifier-suffix-followup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate focused identity cases
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_operator_intake.py -k 'retained_broad_identifier_suffix_swap or subject_prefix_before_relocated_identifier or identifier_moved_behind_action or removed_strong_leading_identifier or title_cased_identifier_as_plural or lowercase_as_os_regular_plural or regular_trailing_s_plural or acceptance_predicate_inversion_anchor'
          python -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/operator_intake.py tests/test_operator_intake.py
          git rm .github/pr2246-retained-identifier-suffix-followup.py .github/workflows/pr2246-retained-identifier-suffix-followup-once.yml
          git commit -m "fix(intake): keep retained identifiers from masking subject swaps"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
