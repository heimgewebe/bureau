name: PR 2175 final review repair

on:
  push:
    branches:
      - fix/runtime-refresh-authority-preflight-r3-20260825

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: launch guarded PR 2175 final review repair' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply exact reviewed patch
        run: python .github/scripts/tmp_pr2175_final_review_repair.py
      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_task_specs.py tests/test_runtime_refresh.py
          python -m ruff check src/bureau/runtime_refresh.py src/bureau/task_specs.py tests/test_runtime_refresh.py tests/test_task_specs.py
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-PR2172-SOURCE-CONVERGENCE-20260825.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-AFTER-PR2174-REPOGROUND-T020-20260825.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-HALL-OF-MEMORY-RESOURCE-20260824.json >/dev/null
          git diff --check
      - name: Commit self-clean output branch
        shell: bash
        env:
          OUTPUT_BRANCH: pr2175-final-review-repair-output
        run: |
          set -euo pipefail
          git rm .github/workflows/pr2175-final-review-repair.yml .github/scripts/tmp_pr2175_final_review_repair.py
          git add -A -- \
            docs/bureau-runtime-refresh-v1.md \
            registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-PR2172-SOURCE-CONVERGENCE-20260825.json \
            registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-AFTER-PR2174-REPOGROUND-T020-20260825.json \
            registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-HALL-OF-MEMORY-RESOURCE-20260824.json \
            src/bureau/runtime_refresh.py \
            src/bureau/task_specs.py \
            tests/test_runtime_refresh.py \
            tests/test_task_specs.py \
            .github/workflows/pr2175-final-review-repair.yml \
            .github/scripts/tmp_pr2175_final_review_repair.py
          git diff --cached --check
          expected=$(cat <<'EOF'
          .github/scripts/tmp_pr2175_final_review_repair.py
          .github/workflows/pr2175-final-review-repair.yml
          docs/bureau-runtime-refresh-v1.md
          registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-AFTER-PR2174-REPOGROUND-T020-20260825.json
          registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-HALL-OF-MEMORY-RESOURCE-20260824.json
          registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-PR2172-SOURCE-CONVERGENCE-20260825.json
          src/bureau/runtime_refresh.py
          src/bureau/task_specs.py
          tests/test_runtime_refresh.py
          tests/test_task_specs.py
          EOF
          )
          observed=$(git diff --cached --name-only | sort)
          test "$observed" = "$(printf '%s\n' "$expected" | sort)"
          remote=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'grabowski-operator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Address final runtime-refresh review findings'
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
