name: pr1322-apply-coordinated-approval

on:
  push:
    branches:
      - operator/reposkop-v2-runtime-cutover-20260801
    paths:
      - tools/_pr1322_apply.py
      - .github/workflows/pr1322-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact patch
        run: python tools/_pr1322_apply.py
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Validate coordinated approval contract
        run: python -m pytest -q tests/test_v2.py -k 'coordinated_claim or coordinated_runtime'
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit verified patch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/v2.py src/bureau/cli.py tests/test_v2.py
          if git diff --cached --quiet; then
            echo "Expected patch produced no changes" >&2
            exit 1
          fi
          git commit -m "Enforce declared approval class in coordinated claims"
          git push origin "HEAD:${BRANCH}"
