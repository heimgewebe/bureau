name: PR 2246 relocation prefix follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "ed4a6c780188bfd86fa2ee982817844121a009ef"
          git diff --quiet f41ec03b3fb3176de53a1a87f3def6f57fd9ac87 HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply exact follow-up
        run: python3 .github/pr2246-relocation-prefix-followup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate focused identity cases
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_operator_intake.py -k 'subject_prefix_before_relocated_identifier or identifier_moved_behind_action or removed_strong_leading_identifier or title_cased_identifier_as_plural or lowercase_as_os_regular_plural or acceptance_predicate_inversion_anchor'
          python -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/operator_intake.py tests/test_operator_intake.py
          git rm .github/pr2246-relocation-prefix-followup.py .github/workflows/pr2246-relocation-prefix-followup-once.yml
          git commit -m "fix(intake): restrict relocated identifier prefixes"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
