name: pr1814-review-fix
on:
  push:
    branches:
      - fix/bureau-control-plane-v3-t006-lifecycle-reconciliation-20260808
    paths:
      - .github/workflows/pr1814-review-fix.yml
permissions:
  contents: write
jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify bootstrap parent
        env:
          EXPECTED_PARENT: 0e476791eaeaa5f3ecd6de0ecde18caa98168fc7
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
      - name: Apply exact review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("src/bureau/v2.py")
          source = source_path.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''def _structural_task_reconcile_candidates(
              registry: Registry,
              overlays: dict[str, str],
              task_revisions: dict[str, dict[str, Any]],
          ) -> list[dict[str, Any]]:
              candidates: list[dict[str, Any]] = []
              for task in registry.tasks.values():''',
              '''def _structural_task_reconcile_candidates(
              registry: Registry,
              store: StateStore,
              overlays: dict[str, str],
              task_revisions: dict[str, dict[str, Any]],
          ) -> list[dict[str, Any]]:
              candidates: list[dict[str, Any]] = []
              closure_bridges = closure_bridge_task_ids()
              for task in registry.tasks.values():''',
              "structural helper signature",
          )
          source = replace_once(
              source,
              '''        effective_state = overlays.get(task.id, task.state)
                  if task.state != "planned" or effective_state != "planned":
                      continue
                  parent_child = registry.parent_child_projection(task, overlays)''',
              '''        effective_state = overlays.get(task.id, task.state)
                  if task.state != "planned" or effective_state != "planned":
                      continue
                  initiative = registry.initiatives[task.initiative]
                  if task.id in closure_bridges and initiative.state == "completed":
                      continue
                  parent_child = registry.parent_child_projection(task, overlays)''',
              "closure bridge guard",
          )
          source = replace_once(
              source,
              '''        dependency_states = {
                      dependency: overlays.get(dependency, registry.tasks[dependency].state)
                      for dependency in task.depends_on
                  }
                  if any(state != "verified" for state in dependency_states.values()):
                      continue
                  if parent_child.blocker_reason is not None:''',
              '''        dependency_states = {
                      dependency: overlays.get(dependency, registry.tasks[dependency].state)
                      for dependency in task.depends_on
                  }
                  if any(state != "verified" for state in dependency_states.values()):
                      continue
                  dependency_verification: dict[str, dict[str, Any]] = {}
                  try:
                      for dependency in task.depends_on:
                          dependency_verification[dependency] = verification_stamp(
                              registry, store, dependency
                          )
                  except legacy.StateError:
                      continue
                  if parent_child.blocker_reason is not None:''',
              "dependency verification gate",
          )
          source = replace_once(
              source,
              '''                "dependency_states": dependency_states,
                          "child_task_states": child_states,''',
              '''                "dependency_states": dependency_states,
                          "dependency_verification": dependency_verification,
                          "child_task_states": child_states,''',
              "candidate verification evidence",
          )
          source = replace_once(
              source,
              '''    task_candidates = _structural_task_reconcile_candidates(
                  operational_registry, overlays, task_revisions
              )''',
              '''    task_candidates = _structural_task_reconcile_candidates(
                  operational_registry, store, overlays, task_revisions
              )''',
              "preview helper call",
          )
          source = replace_once(
              source,
              '''            fresh_task_candidates = _structural_task_reconcile_candidates(
                          operational_registry, fresh_overlays, task_revisions
                      )''',
              '''            fresh_task_candidates = _structural_task_reconcile_candidates(
                          operational_registry, store, fresh_overlays, task_revisions
                      )''',
              "apply helper call",
          )
          source_path.write_text(source, encoding="utf-8")

          tests_path = Path("tests/test_v2.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_test = '''def test_lifecycle_reconcile_promotes_planned_task_after_verified_dependency(
              registry_factory, tmp_path, monkeypatch
          ):
              root = registry_factory(2)
              registry, store, _ = setup(root, tmp_path, monkeypatch)
              store.import_registry_task_specs(registry)
              task_files_before = {
                  path.name: path.read_bytes()
                  for path in (root / "registry/tasks").glob("*.json")
              }
              dependency_id, task_id = sorted(registry.tasks)

              dependency = store.task_spec(dependency_id)
              assert dependency is not None
              dependency_spec = dict(dependency["spec"])
              dependency_spec["state"] = "verified"
              store.put_task_spec(
                  dependency_spec,
                  idempotency_key="lifecycle-dependency-verified",
                  expected_revision=dependency["revision"],
                  source="test",
              )

              current = store.task_spec(task_id)
              assert current is not None
              task_spec = dict(current["spec"])
              task_spec["state"] = "planned"
              task_spec["depends_on"] = [dependency_id]
              planned = store.put_task_spec(
                  task_spec,
                  idempotency_key="lifecycle-dependent-planned",
                  expected_revision=current["revision"],
                  source="test",
              )

              preview = bureau_v2.reconcile_initiative_lifecycle(registry, store)
              assert preview["task_candidate_count"] == 1
              candidate = preview["task_candidates"][0]
              assert candidate["task_id"] == task_id
              assert candidate["from_state"] == "planned"
              assert candidate["to_state"] == "ready"
              assert candidate["revision"] == planned["revision"]
              assert candidate["dependency_states"] == {dependency_id: "verified"}

              applied = bureau_v2.reconcile_initiative_lifecycle(registry, store, apply=True)
              assert applied["changed_task_count"] == 1
              assert applied["total_changed_count"] == 1
              after = store.task_spec(task_id)
              assert after is not None
              assert after["revision"] == planned["revision"] + 1
              assert after["spec"]["state"] == "ready"
              assert {
                  path.name: path.read_bytes()
                  for path in (root / "registry/tasks").glob("*.json")
              } == task_files_before
          '''
          new_test = '''def test_lifecycle_reconcile_promotes_planned_task_after_verified_dependency(
              registry_factory, tmp_path, monkeypatch
          ):
              root = registry_factory(2)
              registry, store, _ = setup(root, tmp_path, monkeypatch)
              store.import_registry_task_specs(registry)
              task_files_before = {
                  path.name: path.read_bytes()
                  for path in (root / "registry/tasks").glob("*.json")
              }
              dependency_id, task_id = sorted(registry.tasks)

              dependency = store.task_spec(dependency_id)
              assert dependency is not None
              dependency_spec = dict(dependency["spec"])
              dependency_spec["state"] = "verified"
              unbound = store.put_task_spec(
                  dependency_spec,
                  idempotency_key="lifecycle-dependency-verified-without-evidence",
                  expected_revision=dependency["revision"],
                  source="test",
              )

              current = store.task_spec(task_id)
              assert current is not None
              task_spec = dict(current["spec"])
              task_spec["state"] = "planned"
              task_spec["depends_on"] = [dependency_id]
              planned = store.put_task_spec(
                  task_spec,
                  idempotency_key="lifecycle-dependent-planned",
                  expected_revision=current["revision"],
                  source="test",
              )

              unbound_preview = bureau_v2.reconcile_initiative_lifecycle(registry, store)
              assert unbound_preview["task_candidate_count"] == 0

              dependency = store.task_spec(dependency_id)
              assert dependency is not None
              assert dependency["revision"] == unbound["revision"]
              dependency_spec = dict(dependency["spec"])
              metadata = dict(dependency_spec.get("metadata", {}))
              metadata["verification"] = {
                  "task_sha256": task_revision_sha256(dependency_spec),
                  "plan_sha256": plan_sha256(registry, dependency_spec["initiative"]),
              }
              dependency_spec["metadata"] = metadata
              store.put_task_spec(
                  dependency_spec,
                  idempotency_key="lifecycle-dependency-verification-evidence",
                  expected_revision=dependency["revision"],
                  source="test",
              )

              preview = bureau_v2.reconcile_initiative_lifecycle(registry, store)
              assert preview["task_candidate_count"] == 1
              candidate = preview["task_candidates"][0]
              assert candidate["task_id"] == task_id
              assert candidate["from_state"] == "planned"
              assert candidate["to_state"] == "ready"
              assert candidate["revision"] == planned["revision"]
              assert candidate["dependency_states"] == {dependency_id: "verified"}
              assert candidate["dependency_verification"][dependency_id]["task_sha256"] == (
                  task_revision_sha256(dependency_spec)
              )

              applied = bureau_v2.reconcile_initiative_lifecycle(registry, store, apply=True)
              assert applied["changed_task_count"] == 1
              assert applied["total_changed_count"] == 1
              after = store.task_spec(task_id)
              assert after is not None
              assert after["revision"] == planned["revision"] + 1
              assert after["spec"]["state"] == "ready"
              assert {
                  path.name: path.read_bytes()
                  for path in (root / "registry/tasks").glob("*.json")
              } == task_files_before
          '''
          tests = replace_once(tests, old_test, new_test, "dependency lifecycle regression test")

          closure_test = '''

          def test_lifecycle_reconcile_preserves_planned_closure_bridge_for_completed_initiative(
              registry_factory, tmp_path, monkeypatch
          ):
              root = registry_factory(2)
              registry, store, _ = setup(root, tmp_path, monkeypatch)
              store.import_registry_task_specs(registry)
              dependency_id, task_id = sorted(registry.tasks)

              dependency = store.task_spec(dependency_id)
              assert dependency is not None
              dependency_spec = dict(dependency["spec"])
              dependency_spec["state"] = "verified"
              metadata = dict(dependency_spec.get("metadata", {}))
              metadata["verification"] = {
                  "task_sha256": task_revision_sha256(dependency_spec),
                  "plan_sha256": plan_sha256(registry, dependency_spec["initiative"]),
              }
              dependency_spec["metadata"] = metadata
              store.put_task_spec(
                  dependency_spec,
                  idempotency_key="lifecycle-closure-dependency-verified",
                  expected_revision=dependency["revision"],
                  source="test",
              )

              current = store.task_spec(task_id)
              assert current is not None
              task_spec = dict(current["spec"])
              task_spec["state"] = "planned"
              task_spec["depends_on"] = [dependency_id]
              store.put_task_spec(
                  task_spec,
                  idempotency_key="lifecycle-closure-bridge-planned",
                  expected_revision=current["revision"],
                  source="test",
              )
              store.set_initiative_state(task_spec["initiative"], "completed")
              monkeypatch.setattr(bureau_v2, "closure_bridge_task_ids", lambda: {task_id})

              preview = bureau_v2.reconcile_initiative_lifecycle(registry, store)
              assert preview["task_candidate_count"] == 0
              after = store.task_spec(task_id)
              assert after is not None
              assert after["spec"]["state"] == "planned"
          '''
          marker = '''\n\ndef test_lifecycle_reconcile_promotes_parent_after_terminal_child_gate('''
          tests = replace_once(
              tests,
              marker,
              closure_test + marker,
              "closure bridge regression test insertion",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run targeted review regressions
        run: |
          set -euo pipefail
          python -m pytest tests/test_v2.py -k 'lifecycle_reconcile' -q
          python -m ruff check src/bureau/v2.py tests/test_v2.py
          git diff --check
      - name: Commit and push only if branch is unchanged
        env:
          BRANCH: fix/bureau-control-plane-v3-t006-lifecycle-reconciliation-20260808
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bureau/v2.py tests/test_v2.py
          git diff --cached --quiet && { echo 'no patch produced'; exit 1; }
          git commit -m 'fix(bureau): bind lifecycle promotion to verification evidence'
          git fetch origin "${BRANCH}"
          expected_remote="$(git rev-parse HEAD^)"
          actual_remote="$(git rev-parse FETCH_HEAD)"
          test "${actual_remote}" = "${expected_remote}"
          git push origin "HEAD:refs/heads/${BRANCH}"
