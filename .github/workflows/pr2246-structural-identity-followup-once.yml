name: PR 2246 structural identity follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "b19004722a530438ba10e0eba166b7c2a4a5beef"
          git diff --quiet a6701ec21709a4089d7f8067f008446e40f115f5 HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply structural follow-up
        run: python3 .github/pr2246-structural-identity-followup.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate focused identity cases
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_operator_intake.py -k 'task_prose_predicate_inversion or reordered_replaced_technical_identifier or retained_identifier_behind_action_suffix_swap or pairwise_es_plural or predicate_inversion_as_weak_subject_support or acceptance_predicate_inversion_anchor or retained_broad_identifier_suffix_swap or subject_prefix_before_relocated_identifier or identifier_moved_behind_action or removed_strong_leading_identifier or title_cased_identifier_as_plural or lowercase_as_os_regular_plural or regular_trailing_s_plural or exact_one_token_title or single_complete_subject_token or disjoint_scope_with_title_continuity'
          python -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/operator_intake.py tests/test_operator_intake.py
          git rm .github/pr2246-structural-identity-followup.py .github/workflows/pr2246-structural-identity-followup-once.yml
          git commit -m "fix(intake): harden semantic identity evidence"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
