name: Temporary PR 2175 review round 2 fix

on:
  push:
    branches:
      - fix/runtime-refresh-authority-preflight-r3-20260825

permissions:
  contents: write

jobs:
  apply-fix:
    if: "${{ github.event.head_commit.message == 'ci: rerun guarded PR 2175 review round 2 fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply exact guarded patch
        run: python .github/scripts/tmp_pr2175_review_round2_fix.py
      - name: Focused validation
        shell: bash
        run: |
          python -m pytest -q tests/test_task_specs.py tests/test_runtime_refresh.py
          python -m ruff check src/bureau/task_specs.py src/bureau/v2.py src/bureau/runtime_refresh.py tests/test_task_specs.py tests/test_runtime_refresh.py
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-AFTER-PR2158-BUREAU05-20260823.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-AFTER-PR2174-REPOGROUND-T020-20260825.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-CURRENT-MAIN-SUCCESSOR-20260823.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-CURRENT-MAIN-SUCCESSOR-20260824.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-HALL-OF-MEMORY-RESOURCE-20260824.json >/dev/null
          python -m json.tool registry/tasks/BUREAU-CONTROL-PLANE-V3-FB-RUNTIME-REFRESH-PR2172-SOURCE-CONVERGENCE-20260825.json >/dev/null
          git diff --check
      - name: Commit guarded fix
        shell: bash
        run: |
          git config user.name 'grabowski-operator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- src/bureau/task_specs.py src/bureau/v2.py src/bureau/runtime_refresh.py tests/test_task_specs.py tests/test_runtime_refresh.py docs/bureau-runtime-refresh-v1.md registry/tasks .github/workflows/tmp-pr2175-review-round2-fix.yml .github/scripts/tmp_pr2175_review_round2_fix.py
          git commit -m 'Complete runtime closeout migration and receipt binding'
          git push origin HEAD:${GITHUB_REF_NAME}
