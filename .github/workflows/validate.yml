name: validate
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          scope_kind=full
          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == merge_group ]]; then
            base_sha="${MERGE_GROUP_BASE_SHA}"
            head_sha="${MERGE_GROUP_HEAD_SHA}"
          fi
          if [[ -n "${base_sha}" && -n "${head_sha}" ]]; then
            classifier_path="${RUNNER_TEMP}/bureau-validation-scope.py"
            if git show "${base_sha}:src/bureau/validation_scope.py" \
              > "${classifier_path}" 2>/dev/null; then
              scope_kind="$(python "${classifier_path}" \
                --base-sha "${base_sha}" \
                --head-sha "${head_sha}")"
            fi
          fi
          case "${scope_kind}" in
            full|task-only|queue-only) ;;
            *)
              echo "::error::Unknown validation scope: ${scope_kind}"
              exit 1
              ;;
          esac
          echo "scope_kind=${scope_kind}" >> "${GITHUB_OUTPUT}"
      - name: Install full validation dependencies
        if: steps.scope.outputs.scope_kind == 'full'
        run: python -m pip install -e '.[dev]'
      - name: Install Registry fast-path dependencies
        if: steps.scope.outputs.scope_kind != 'full'
        run: python -m pip install -e .
      - name: Validate code and repository contracts
        if: steps.scope.outputs.scope_kind == 'full'
        run: make validate
      - name: Validate Registry task-only change
        if: steps.scope.outputs.scope_kind == 'task-only'
        run: PYTHONPATH=src python -m bureau.cli --root . --json check
      - name: Validate Queue-only Registry change
        if: steps.scope.outputs.scope_kind == 'queue-only'
        run: PYTHONPATH=src python -m bureau.cli --root . --json check
