name: Registry task registration preflight

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  pull-request-preflight:
    name: registry-registration-preflight/freshness
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted Bureau base
        run: python -m pip install -e .
      - name: Check Registry task reservations with base code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/registry-registration-preflight
          task_files_file="$(mktemp)"
          if ! gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate \
            --jq '.[] | select((.status == "added" or .status == "renamed") and (.filename | test("^registry/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,239}\\.json$"))) | .filename' > "${task_files_file}"; then
            rm -f "${task_files_file}"
            exit 1
          fi
          mapfile -t task_files < "${task_files_file}"
          rm -f "${task_files_file}"
          overall=success
          for task_file in "${task_files[@]}"; do
            mkdir -p "$(dirname "${task_file}")"
            gh api "repos/${HEAD_REPOSITORY}/contents/${task_file}?ref=${PR_HEAD_SHA}" \
              --jq .content | base64 --decode > "${task_file}"
            receipt_key="${task_file#registry/tasks/}"
            receipt_key="${receipt_key%.json}"
            set +e
            bureau --root . --json registry-registration-preflight \
              --repo-slug "${REPOSITORY}" \
              --task-json "${task_file}" \
              --checked-base-sha "${CHECKED_BASE_SHA}" \
              --pr-number "${PR_NUMBER}" \
              --head-sha "${PR_HEAD_SHA}" \
              --receipt-out "artifacts/registry-registration-preflight/${receipt_key}.json"
            rc=$?
            set -e
            if [[ ${rc} -ne 0 ]]; then
              overall=failure
            fi
          done
          if [[ "${overall}" != success ]]; then
            exit 1
          fi
      - name: Upload registration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-registration-preflight-${{ github.event.pull_request.number }}
          path: artifacts/registry-registration-preflight
          if-no-files-found: ignore

  main-push-revalidation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: registry-registration-preflight-main-push
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install trusted Bureau main
        run: python -m pip install -e .
      - name: Revalidate open Registry allocation pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
          CHECK_NAME: registry-registration-preflight/freshness
        run: |
          set -euo pipefail
          mkdir -p artifacts/registry-registration-preflight
          run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}?base_sha=${CURRENT_MAIN_SHA}"

          create_check_run() {
            local sha="$1"
            local pr_number="$2"
            local payload
            payload="$(jq -n \
              --arg name "${CHECK_NAME}" \
              --arg head_sha "${sha}" \
              --arg details_url "${run_url}" \
              --arg external_id "registry-freshness:${pr_number}:${sha}:${CURRENT_MAIN_SHA}" \
              --arg title "Registry allocation revalidation" \
              --arg summary "Checking PR #${pr_number} against main ${CURRENT_MAIN_SHA}." \
              '{name:$name,head_sha:$head_sha,status:"in_progress",details_url:$details_url,external_id:$external_id,output:{title:$title,summary:$summary}}')"
            local attempt check_run_id
            for attempt in 1 2 3; do
              if check_run_id="$(gh api -X POST "repos/${REPOSITORY}/check-runs" \
                -H "Accept: application/vnd.github+json" \
                --input - --jq .id <<< "${payload}")"; then
                printf '%s\n' "${check_run_id}"
                return 0
              fi
              sleep "${attempt}"
            done
            return 1
          }

          complete_check_run() {
            local check_run_id="$1"
            local conclusion="$2"
            local title="$3"
            local summary="$4"
            local completed_at payload
            completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            payload="$(jq -n \
              --arg status completed \
              --arg conclusion "${conclusion}" \
              --arg completed_at "${completed_at}" \
              --arg details_url "${run_url}" \
              --arg title "${title}" \
              --arg summary "${summary}" \
              '{status:$status,conclusion:$conclusion,completed_at:$completed_at,details_url:$details_url,output:{title:$title,summary:$summary}}')"
            local attempt
            for attempt in 1 2 3; do
              if gh api -X PATCH "repos/${REPOSITORY}/check-runs/${check_run_id}" \
                -H "Accept: application/vnd.github+json" \
                --input - >/dev/null <<< "${payload}"; then
                return 0
              fi
              sleep "${attempt}"
            done
            return 1
          }

          pr_rows_file="$(mktemp)"
          if ! gh api "repos/${REPOSITORY}/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | [.number, .head.sha, (.head.repo.full_name // "")] | @tsv' > "${pr_rows_file}"; then
            echo "::error::Cannot enumerate open pull requests for Registry freshness invalidation"
            exit 1
          fi
          mapfile -t pr_rows < "${pr_rows_file}"
          rm -f "${pr_rows_file}"

          # Create an in-progress CheckRun for every known open PR before validating any individual PR.
          # A partial or failed publication leaves the affected PR fail-closed.
          declare -A check_run_ids=()
          create_failed=0
          for row in "${pr_rows[@]}"; do
            IFS=$'\t' read -r pr_number pr_head_sha pr_head_repository <<< "${row}"
            if [[ ! "${pr_number}" =~ ^[0-9]+$ || ! "${pr_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Malformed open PR row: ${row}"
              create_failed=1
              continue
            fi
            if ! check_run_id="$(create_check_run "${pr_head_sha}" "${pr_number}")"; then
              echo "::error::Cannot create Registry freshness CheckRun for PR #${pr_number}"
              create_failed=1
              continue
            fi
            if [[ ! "${check_run_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::Malformed Registry freshness CheckRun id for PR #${pr_number}"
              create_failed=1
              continue
            fi
            check_run_ids["${pr_number}"]="${check_run_id}"
          done
          if [[ ${create_failed} -ne 0 ]]; then
            exit 1
          fi

          infrastructure_failed=0
          for row in "${pr_rows[@]}"; do
            IFS=$'\t' read -r pr_number pr_head_sha pr_head_repository <<< "${row}"
            check_run_id="${check_run_ids[${pr_number}]}"
            task_files_file="$(mktemp)"
            if ! gh api "repos/${REPOSITORY}/pulls/${pr_number}/files?per_page=100" --paginate \
              --jq '.[] | select((.status == "added" or .status == "renamed") and (.filename | test("^registry/tasks/[A-Za-z0-9][A-Za-z0-9._:-]{0,239}\\.json$"))) | .filename' > "${task_files_file}"; then
              rm -f "${task_files_file}"
              complete_check_run \
                "${check_run_id}" failure \
                "Registry allocation revalidation errored" \
                "Could not inspect changed files for PR #${pr_number} against main ${CURRENT_MAIN_SHA}." || true
              echo "::error::Cannot inspect changed files for PR #${pr_number}"
              infrastructure_failed=1
              continue
            fi
            mapfile -t task_files < "${task_files_file}"
            rm -f "${task_files_file}"

            if [[ ${#task_files[@]} -eq 0 ]]; then
              if ! complete_check_run \
                "${check_run_id}" success \
                "Registry allocation current on main" \
                "PR #${pr_number} has no new Registry task allocation and was checked against main ${CURRENT_MAIN_SHA}."; then
                echo "::error::Cannot publish Registry freshness CheckRun for PR #${pr_number}"
                infrastructure_failed=1
              fi
              continue
            fi

            overall=success
            infrastructure_error=0
            receipt_dir="artifacts/registry-registration-preflight/pr-${pr_number}"
            mkdir -p "${receipt_dir}"
            if [[ -z "${pr_head_repository}" ]]; then
              overall=failure
              infrastructure_error=1
            else
              for task_file in "${task_files[@]}"; do
                mkdir -p "$(dirname "${task_file}")"
                task_tmp="$(mktemp)"
                if ! gh api "repos/${pr_head_repository}/contents/${task_file}?ref=${pr_head_sha}" \
                  --jq .content | base64 --decode > "${task_tmp}"; then
                  rm -f "${task_tmp}"
                  overall=failure
                  infrastructure_error=1
                  continue
                fi
                mv "${task_tmp}" "${task_file}"
                receipt_key="${task_file#registry/tasks/}"
                receipt_key="${receipt_key%.json}"
                if ! bureau --root . --json registry-registration-preflight \
                  --repo-slug "${REPOSITORY}" \
                  --task-json "${task_file}" \
                  --checked-base-sha "${CURRENT_MAIN_SHA}" \
                  --pr-number "${pr_number}" \
                  --head-sha "${pr_head_sha}" \
                  --receipt-out "${receipt_dir}/${receipt_key}.json"; then
                  overall=failure
                fi
              done
            fi

            if [[ ${infrastructure_error} -ne 0 ]]; then
              title="Registry allocation revalidation errored"
              summary="Infrastructure failed while checking PR #${pr_number} against main ${CURRENT_MAIN_SHA}."
              infrastructure_failed=1
            elif [[ "${overall}" == success ]]; then
              title="Registry allocation current on main"
              summary="Registry allocations in PR #${pr_number} remain valid against main ${CURRENT_MAIN_SHA}."
            else
              title="Registry allocation blocked after main update"
              summary="Registry allocations in PR #${pr_number} conflict with main ${CURRENT_MAIN_SHA}."
            fi
            if ! complete_check_run \
              "${check_run_id}" "${overall}" "${title}" "${summary}"; then
              echo "::error::Cannot complete Registry freshness CheckRun for PR #${pr_number}"
              infrastructure_failed=1
            fi
          done

          if [[ ${infrastructure_failed} -ne 0 ]]; then
            exit 1
          fi
      - name: Upload revalidation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-registration-revalidation-${{ github.sha }}
          path: artifacts/registry-registration-preflight
          if-no-files-found: ignore
