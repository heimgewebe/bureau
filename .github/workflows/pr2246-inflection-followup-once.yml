name: PR 2246 inflection follow-up once

on:
  push:
    branches:
      - fix/task-revision-identity-continuity-20260902

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/task-revision-identity-continuity-20260902
          fetch-depth: 0
      - name: Bind exact product preimage
        run: |
          test "$(git rev-parse HEAD^)" = "bc623351d8b961f100c0802799e51a961b5aa7fe"
          git diff --quiet 2b343094fcc90cc2bef4f5f343e0c4800496327e HEAD -- src/bureau/operator_intake.py tests/test_operator_intake.py
      - name: Apply exact patch
        run: python3 .github/pr2246-inflection-followup.py
      - name: Verify patch shape
        run: |
          python3 -m compileall -q src/bureau/operator_intake.py tests/test_operator_intake.py
          git diff --check
          git diff --stat
      - name: Publish product-only follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bureau/operator_intake.py tests/test_operator_intake.py
          git rm .github/pr2246-inflection-followup.py .github/workflows/pr2246-inflection-followup-once.yml
          git commit -m "fix(intake): preserve identifier case in inflection"
          git push origin HEAD:fix/task-revision-identity-continuity-20260902
