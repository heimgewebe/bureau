name: refill-bureau-now-lane

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refill-bureau-now-lane
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Bureau
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bureau
        run: python -m pip install -e '.[dev]'

      - name: Refill Now lane when below floor
        id: refill
        shell: bash
        run: |
          set -euo pipefail
          python -m bureau.now_refill \
            --root . \
            --floor 2 \
            --target 4 \
            --max-promotions 4 \
            --apply \
            --authority github-actions-now-lane-refill \
            > "$RUNNER_TEMP/now-lane-refill.json"
          cat "$RUNNER_TEMP/now-lane-refill.json"
          if git diff --quiet -- registry/queue.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bounded mutation
        if: steps.refill.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(git diff --name-only)
          if [[ ${#changed_paths[@]} -ne 1 || "${changed_paths[0]}" != "registry/queue.json" ]]; then
            printf 'Unexpected changed paths:\n'
            printf '  %s\n' "${changed_paths[@]}"
            exit 1
          fi
          make validate

      - name: Publish refill proposal branch
        if: steps.refill.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/now-lane-refill'
          remote_ref="refs/heads/$branch"
          tracking_ref="refs/remotes/origin/$branch"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/queue.json
          git commit -m 'chore(queue): refill Bureau Now lane'

          if git ls-remote --exit-code --heads origin "$remote_ref" >/dev/null 2>&1; then
            git fetch origin "$remote_ref:$tracking_ref"
            expected_remote="$(git rev-parse "$tracking_ref")"
            git push \
              --force-with-lease="$remote_ref:$expected_remote" \
              origin "HEAD:$remote_ref"
          else
            git push origin "HEAD:$remote_ref"
          fi
