name: validate
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          scope_kind=full
          base_sha=""
          head_sha=""
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == merge_group ]]; then
            base_sha="${MERGE_GROUP_BASE_SHA}"
            head_sha="${MERGE_GROUP_HEAD_SHA}"
          fi
          if [[ -n "${base_sha}" && -n "${head_sha}" ]]; then
            classifier_path="${RUNNER_TEMP}/bureau-validation-scope.py"
            if git show "${base_sha}:src/bureau/validation_scope.py" \
              > "${classifier_path}" 2>/dev/null; then
              scope_kind="$(python "${classifier_path}" \
                --base-sha "${base_sha}" \
                --head-sha "${head_sha}")"
            fi
          fi
          case "${scope_kind}" in
            full|task-only|queue-only) ;;
            *)
              echo "::error::Unknown validation scope: ${scope_kind}"
              exit 1
              ;;
          esac
          echo "scope_kind=${scope_kind}" >> "${GITHUB_OUTPUT}"
      - name: Choose validation tier
        id: tier
        if: steps.scope.outputs.scope_kind == 'full'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tier=full
          # Only normal PR admission to Bureau's queued main may be lighter.
          # An unavailable rule read is not evidence of a mandatory queue.
          if [[ "$EVENT_NAME" == pull_request && "$BASE_REF" == main && "$REPOSITORY" == heimgewebe/bureau ]]; then
            if queued="$(timeout 10s gh api "repos/$REPOSITORY/rules/branches/main" \
              --jq 'if type == "array" then any(.[]; .type == "merge_queue") else false end')" \
              && [[ "$queued" == true ]]; then
              tier=admission
            fi
          fi
          # Reuse only an exact, complete two-version full merge-group run.
          # The repository-level SHA query includes runs on retired queue refs.
          # Missing, ambiguous, partial or unavailable evidence means full validation.
          if [[ "$EVENT_NAME" == push && "$REPOSITORY" == heimgewebe/bureau \
            && "${REF_NAME:-}" == refs/heads/main && "${HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            if runs="$(timeout 10s gh api "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=30")" \
              && proof="$(jq -er --arg sha "$HEAD_SHA" --arg repo "$REPOSITORY" '
                select(.total_count == (.workflow_runs | length))
                | [.workflow_runs[] | select(
                    .head_sha == $sha and .head_repository.full_name == $repo
                    and .event == "merge_group" and .path == ".github/workflows/validate.yml"
                    and .status == "completed" and .conclusion == "success"
                    and (.head_branch | startswith("gh-readonly-queue/main/")))]
                | select(length == 1) | .[0] | [.id, .run_attempt] | @tsv
              ' <<< "$runs")"; then
              read -r run_id attempt <<< "$proof"
              if [[ "$run_id" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]] \
                && jobs="$(timeout 10s gh api "repos/$REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")" \
                && jq -e --arg sha "$HEAD_SHA" --argjson attempt "$attempt" '
                  .total_count == 2 and (.jobs | length == 2)
                  and ([.jobs[].name] | sort == ["validate (3.10)", "validate (3.12)"])
                  and all(.jobs[];
                    .head_sha == $sha and .run_attempt == $attempt
                    and .status == "completed" and .conclusion == "success"
                    and ([.steps[] | select(.name == "Validate code and repository contracts")]
                      | length == 1 and .[0].status == "completed" and .[0].conclusion == "success"))
                ' <<< "$jobs" >/dev/null; then
                tier=main-reuse
                echo "Reusing full merge-group validation: run $run_id attempt $attempt for $HEAD_SHA"
              fi
            fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Validation tier: $tier"
      - name: Install full validation dependencies
        if: steps.scope.outputs.scope_kind == 'full'
        run: python -m pip install -e '.[dev]'
      - name: Install Registry fast-path dependencies
        if: steps.scope.outputs.scope_kind != 'full'
        run: python -m pip install -e .
      - name: Validate code and repository contracts
        if: steps.scope.outputs.scope_kind == 'full' && steps.tier.outputs.tier == 'full'
        run: make validate
      - name: Validate PR queue admission (not final integration)
        if: steps.scope.outputs.scope_kind == 'full' && steps.tier.outputs.tier == 'admission'
        run: make validate-admission
      - name: Validate main after proven full integration
        if: steps.scope.outputs.scope_kind == 'full' && steps.tier.outputs.tier == 'main-reuse'
        run: make validate-main-reuse
      - name: Validate Registry task-only change
        if: steps.scope.outputs.scope_kind == 'task-only'
        run: PYTHONPATH=src python -m bureau.cli --root . --json check
      - name: Validate Queue-only Registry change
        if: steps.scope.outputs.scope_kind == 'queue-only'
        run: PYTHONPATH=src python -m bureau.cli --root . --json check
