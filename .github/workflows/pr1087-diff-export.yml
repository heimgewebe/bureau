name: pr1087-diff-export
on:
  pull_request:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export exact reviewed diff
        env:
          BASE_SHA: a004c51f70adb9e981a0430404a4e8c2f144a5c7
          PRODUCT_HEAD_SHA: 8266df2ac290f78f19842b9958897c4d38fbe70a
          OUTPUT: bureau-pr-1087-a004c51f-8266df2a.diff
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${PRODUCT_HEAD_SHA}^{commit}"
          git diff --binary --full-index "${BASE_SHA}" "${PRODUCT_HEAD_SHA}" > "${OUTPUT}"
          test "$(git diff --name-only "${BASE_SHA}" "${PRODUCT_HEAD_SHA}" | wc -l)" -eq 23
          sha256sum "${OUTPUT}" > "${OUTPUT}.sha256"
          printf 'base=%s\nhead=%s\nchanged_files=23\n' "${BASE_SHA}" "${PRODUCT_HEAD_SHA}" > "${OUTPUT}.manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bureau-pr-1087-a004c51f-8266df2a
          path: |
            bureau-pr-1087-a004c51f-8266df2a.diff
            bureau-pr-1087-a004c51f-8266df2a.diff.sha256
            bureau-pr-1087-a004c51f-8266df2a.diff.manifest.txt
          if-no-files-found: error
          retention-days: 7
